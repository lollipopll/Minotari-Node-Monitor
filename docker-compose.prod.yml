# ==============================================================================
# Production Docker Compose (Ready-to-use with pre-built image from GHCR)
# No local build, no Python/protoc dependencies required on the target server.
# ==============================================================================

services:
  minotari-monitor:
    # Готовый Docker-образ из GitHub Container Registry (ghcr.io/lollipopll/minotari-node-monitor)
    image: ghcr.io/lollipopll/minotari-node-monitor:latest
    container_name: minotari-node-monitor
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - TARI_NODE_GRPC_HOST=${TARI_NODE_GRPC_HOST:-host.docker.internal}
      - TARI_NODE_GRPC_PORT=${TARI_NODE_GRPC_PORT:-18145}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-15}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      - GITHUB_REPO=${GITHUB_REPO:-tari-project/tari}
      - TARI_NODE_TLS=${TARI_NODE_TLS:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
